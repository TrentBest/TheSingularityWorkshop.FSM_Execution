name: Build Execution workbench Pages

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      publish:
        description: "Choose preview (artifact only) or deploy (publish the Pages site)"
        required: true
        type: choice
        options:
          - preview
          - deploy
        default: preview

permissions:
  contents: read

concurrency:
  group: execution-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Execution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned commit SHA
      - name: Assemble static workbench
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -F "Execution · Workshop Workbench" _site/index.html
          grep -F "workflow-evidence.v2" _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # pinned commit SHA
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'deploy'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Execution workbench
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # pinned commit SHA
